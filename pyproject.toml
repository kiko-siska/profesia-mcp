[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profesia-mcp"
version = "0.1.0"
description = "Unofficial MCP server for searching and reading job offers on Profesia.sk"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "profesia", "jobs", "slovakia", "model-context-protocol"]
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]

[project.urls]
Homepage = "https://github.com/kiko-siska/profesia-mcp"
Issues = "https://github.com/kiko-siska/profesia-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
profesia-mcp = "profesia_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/profesia_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
